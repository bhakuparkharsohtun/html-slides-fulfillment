name = "html-slides-fulfillment"
main = "src/index.js"
compatibility_date = "2026-01-01"

# nodejs_compat is not required; the worker uses only Web APIs.

[vars]
# Non-secret configuration. Secrets are set with `wrangler secret put`.

# Entra app ID that Partner Center is configured to send webhook tokens for.
WEBHOOK_AUDIENCE = "REPLACE_WITH_WEBHOOK_APP_ID"

# Entra app used by the landing page for interactive sign in.
LANDING_CLIENT_ID = "REPLACE_WITH_LANDING_APP_ID"

# Entra app the PowerPoint add-in signs in with, used by /api/entitlement.
ADDIN_CLIENT_ID = "REPLACE_WITH_ADDIN_APP_ID"

# Publisher tenant. Tokens for the fulfillment API must be issued by the
# tenant that owns the offer, never the customer tenant.
PUBLISHER_TENANT_ID = "REPLACE_WITH_PUBLISHER_TENANT_ID"
PUBLISHER_CLIENT_ID = "REPLACE_WITH_PUBLISHER_APP_ID"

# Where to send the customer after a successful activation.
PRODUCT_URL = "https://website-8f65c512.jpm.waz.mybluehost.me/docs.html"

# Origins allowed to call /api/entitlement from the browser.
ALLOWED_ORIGINS = "https://website-8f65c512.jpm.waz.mybluehost.me"

# KV namespace holding subscriptions and processed event ids.
# Create it first:  wrangler kv namespace create SUBSCRIPTIONS
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
