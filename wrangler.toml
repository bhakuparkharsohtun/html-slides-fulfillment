name = "html-slides-fulfillment"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Non-secret configuration. Secrets are set in the Cloudflare dashboard
# under Settings > Variables and Secrets, with type Secret.

# Entra app ID that Partner Center sends webhook tokens for (App 1 Marketplace Fulfillment).
WEBHOOK_AUDIENCE = "d68ee3d8-604a-4e67-bc0e-ba092e8abc2e"

# Entra app used by the landing page for interactive sign in (App 2 Landing Page).
LANDING_CLIENT_ID = "19d7e8dd-41da-4301-8654-9f2d9914efe0

# Entra app the PowerPoint add-in signs in with (App 3 HTML Add-in).
ADDIN_CLIENT_ID = "7fa88c81-aa12-487b-b13f-0c8fbda42b79"

# Publisher tenant. Tokens for the fulfillment API must be issued by the
# tenant that owns the offer, never the customer tenant.
PUBLISHER_TENANT_ID = "b33df94e-04eb-4c0d-a596-812de8e21769"
PUBLISHER_CLIENT_ID = "d68ee3d8-604a-4e67-bc0e-ba092e8abc2e"

# Where to send the customer after a successful activation.
PRODUCT_URL = "https://website-8f65c512.jpm.waz.mybluehost.me/docs.html"

# Origins allowed to call /api/entitlement from the browser.
ALLOWED_ORIGINS = "https://website-8f65c512.jpm.waz.mybluehost.me"

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "d6021ee7195946b9a446b7461e22c7be"

[observability]
enabled = true
